<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <!-- Zen fog / mist gradient — soft sage greens -->
    <linearGradient id="zenBg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#1a2e25"/>
      <stop offset="35%" stop-color="#243d30"/>
      <stop offset="65%" stop-color="#2f5240"/>
      <stop offset="100%" stop-color="#1c3328"/>
    </linearGradient>
    <radialGradient id="mistGlow" cx="50%" cy="55%" r="50%">
      <stop offset="0%" stop-color="rgba(180,210,190,0.25)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
    <linearGradient id="overlay4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0,0,0,0.5)"/>
      <stop offset="45%" stop-color="rgba(0,0,0,0.15)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.65)"/>
    </linearGradient>
    <filter id="glow4">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softBlur4">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="leafBlur">
      <feGaussianBlur stdDeviation="1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#zenBg)"/>

  <!-- Mist glow center -->
  <rect width="1200" height="800" fill="url(#mistGlow)"/>

  <!-- Bamboo / tall grass silhouettes left -->
  <g fill="rgba(60,90,65,0.7)" filter="url(#leafBlur)">
    <rect x="40" y="100" width="6" height="700"/>
    <rect x="55" y="150" width="4" height="650"/>
    <rect x="68" y="80" width="7" height="720"/>
    <rect x="84" y="200" width="5" height="600"/>
    <rect x="100" y="120" width="6" height="680"/>
    <rect x="115" y="170" width="4" height="630"/>
    <!-- Bamboo joints -->
    <rect x="39" y="250" width="8" height="3" fill="rgba(80,110,80,0.5)"/>
    <rect x="39" y="400" width="8" height="3" fill="rgba(80,110,80,0.5)"/>
    <rect x="39" y="550" width="8" height="3" fill="rgba(80,110,80,0.5)"/>
    <rect x="66" y="290" width="9" height="3" fill="rgba(80,110,80,0.5)"/>
    <rect x="66" y="460" width="9" height="3" fill="rgba(80,110,80,0.5)"/>
  </g>

  <!-- Bamboo silhouettes right -->
  <g fill="rgba(60,90,65,0.7)" filter="url(#leafBlur)">
    <rect x="1090" y="90" width="6" height="710"/>
    <rect x="1104" y="140" width="5" height="660"/>
    <rect x="1117" y="60" width="7" height="740"/>
    <rect x="1130" y="180" width="4" height="620"/>
    <rect x="1142" y="110" width="6" height="690"/>
    <rect x="1155" y="160" width="5" height="640"/>
    <!-- joints -->
    <rect x="1089" y="270" width="8" height="3" fill="rgba(80,110,80,0.5)"/>
    <rect x="1089" y="440" width="8" height="3" fill="rgba(80,110,80,0.5)"/>
    <rect x="1089" y="610" width="8" height="3" fill="rgba(80,110,80,0.5)"/>
    <rect x="1115" y="310" width="9" height="3" fill="rgba(80,110,80,0.5)"/>
    <rect x="1115" y="490" width="9" height="3" fill="rgba(80,110,80,0.5)"/>
  </g>

  <!-- Ground mist -->
  <ellipse cx="600" cy="780" rx="700" ry="80" fill="rgba(180,210,185,0.12)" filter="url(#softBlur4)"/>

  <!-- Zen stones silhouette at bottom center -->
  <ellipse cx="590" cy="760" rx="45" ry="22" fill="rgba(50,75,55,0.8)"/>
  <ellipse cx="640" cy="755" rx="30" ry="18" fill="rgba(45,70,50,0.8)"/>
  <ellipse cx="555" cy="758" rx="25" ry="16" fill="rgba(55,80,60,0.8)"/>

  <!-- Overlay -->
  <rect width="1200" height="800" fill="url(#overlay4)"/>

  <!-- Firefly dots -->
  <g fill="rgba(180,240,180,0.7)" filter="url(#glow4)">
    <circle cx="220" cy="380" r="2.2"/>
    <circle cx="310" cy="450" r="1.6"/>
    <circle cx="430" cy="340" r="2.0"/>
    <circle cx="780" cy="360" r="1.8"/>
    <circle cx="880" cy="430" r="2.2"/>
    <circle cx="970" cy="310" r="1.5"/>
  </g>

  <!-- Label -->
  <text x="600" y="200" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="rgba(160,210,170,0.7)" letter-spacing="5" font-style="italic">C A L M S C R O L L  ·  F O C U S</text>
  <line x1="380" y1="224" x2="820" y2="224" stroke="rgba(160,210,170,0.35)" stroke-width="0.8"/>

  <!-- Main quote -->
  <text x="600" y="298" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="white" filter="url(#glow4)">"The ability to resist</text>
  <text x="600" y="350" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="white" filter="url(#glow4)">a short-term impulse</text>
  <text x="600" y="402" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="white" filter="url(#glow4)">creates long-term</text>
  <text x="600" y="454" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="white" filter="url(#glow4)">freedom."</text>

  <!-- Attribution -->
  <line x1="380" y1="482" x2="820" y2="482" stroke="rgba(160,210,170,0.35)" stroke-width="0.8"/>
  <text x="600" y="510" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="rgba(160,210,170,0.75)" font-style="italic">— One pause at a time.</text>
</svg>
