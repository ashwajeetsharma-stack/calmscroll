<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CalmScroll</title>
  <link rel="stylesheet" href="../shared/theme.css">
  <style>
    body {
      width: 375px;
      min-height: 480px;
      margin: 0;
      font-family: var(--font-sans);
      background: var(--color-bg);
      color: var(--color-ink);
      user-select: none;
    }
    #app {
      display: flex;
      flex-direction: column;
      min-height: 480px;
    }

    /* ── Header ── */
    .cs-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--sp-3) var(--sp-4);
      background: var(--color-card);
      border-bottom: 1px solid var(--color-line);
    }
    .cs-logo {
      font-size: var(--text-base);
      font-weight: var(--weight-bold);
      color: var(--color-accent);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .cs-badges {
      display: flex;
      gap: var(--sp-1);
      align-items: center;
    }
    .badge-status {
      font-size: 11px;
      padding: 2px 7px;
      background: var(--color-surface);
      border: 1px solid var(--color-line);
      border-radius: var(--radius-sm);
      color: var(--color-muted);
      font-weight: var(--weight-medium);
    }
    .badge-warden {
      background: var(--color-warden-bg);
      color: var(--color-warden);
      border-color: var(--color-warden);
      font-weight: var(--weight-bold);
    }
    .badge-pomodoro {
      background: #EBF5FB;
      color: #2980B9;
      border-color: #AED6F1;
      font-weight: var(--weight-semibold);
    }

    /* ── Tab Navigation ── */
    .tab-bar {
      display: flex;
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-line);
      padding: 2px 4px 0;
      gap: 2px;
    }
    .tab-btn {
      flex: 1;
      padding: 7px 4px;
      border: none;
      background: transparent;
      color: var(--color-muted);
      font-size: 11px;
      font-weight: var(--weight-semibold);
      font-family: var(--font-sans);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all var(--transition-fast);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .tab-btn:hover {
      color: var(--color-accent);
    }
    .tab-btn.active {
      color: var(--color-accent);
      border-bottom-color: var(--color-accent);
      background: var(--color-card);
      border-radius: var(--radius-sm) var(--radius-sm) 0 0;
    }

    /* ── Tab Content Views ── */
    .tab-pane {
      display: none;
      flex-direction: column;
      flex: 1;
    }
    .tab-pane.active {
      display: flex;
    }

    /* ── Sections & Labels ── */
    .sec {
      padding: var(--sp-3) var(--sp-4);
      border-bottom: 1px solid var(--color-line);
      background: var(--color-card);
    }
    .lbl {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: var(--weight-semibold);
      color: var(--color-muted);
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-bottom: var(--sp-2);
    }

    /* ── Inputs ── */
    .text-in {
      width: 100%;
      padding: 8px 10px;
      background: var(--color-surface);
      border: 1px solid var(--color-line);
      border-radius: var(--radius-md);
      color: var(--color-ink);
      font-size: var(--text-sm);
      font-family: var(--font-sans);
      box-sizing: border-box;
      outline: none;
      transition: border-color var(--transition-fast);
    }
    .text-in:focus {
      border-color: var(--color-accent);
      box-shadow: var(--focus-ring);
    }

    /* ── Pill Buttons ── */
    .btn-grp {
      display: flex;
      gap: var(--sp-2);
      flex-wrap: wrap;
    }
    .pill {
      flex: 1;
      min-width: 50px;
      padding: 6px 4px;
      background: var(--color-surface);
      border: 1px solid var(--color-line);
      border-radius: var(--radius-md);
      color: var(--color-muted);
      font-size: 11px;
      font-weight: var(--weight-medium);
      font-family: var(--font-sans);
      cursor: pointer;
      transition: all var(--transition-fast);
      text-align: center;
    }
    .pill:hover {
      border-color: var(--color-accent);
      color: var(--color-accent);
    }
    .pill.sel {
      background: var(--color-accent);
      border-color: var(--color-accent);
      color: #fff;
      font-weight: var(--weight-semibold);
    }
    .pill.wsel {
      background: var(--color-warden);
      border-color: var(--color-warden);
      color: #fff;
    }

    /* ── Mode selector ── */
    .mode-row {
      display: flex;
      gap: var(--sp-2);
    }
    .mode-btn {
      flex: 1;
      padding: var(--sp-2);
      background: var(--color-surface);
      border: 1px solid var(--color-line);
      border-radius: var(--radius-md);
      color: var(--color-muted);
      font-size: var(--text-xs);
      font-family: var(--font-sans);
      font-weight: var(--weight-semibold);
      cursor: pointer;
      transition: all var(--transition-fast);
      text-align: center;
    }
    .mode-btn.sel {
      background: var(--color-accent);
      border-color: var(--color-accent);
      color: #fff;
    }
    .mode-btn.wsel {
      background: var(--color-warden);
      border-color: var(--color-warden);
      color: #fff;
    }

    .warden-panel {
      margin-top: var(--sp-2);
      padding: var(--sp-3);
      background: var(--color-warden-bg);
      border: 1px solid var(--color-warden);
      border-radius: var(--radius-md);
    }
    .warden-info {
      font-size: 11px;
      color: var(--color-warden);
      line-height: var(--leading-base);
      margin-bottom: var(--sp-2);
    }

    /* ── Start button ── */
    .start-btn {
      width: 100%;
      padding: 11px;
      background: var(--color-accent);
      border: none;
      border-radius: var(--radius-md);
      color: #fff;
      font-size: var(--text-sm);
      font-weight: var(--weight-semibold);
      font-family: var(--font-sans);
      cursor: pointer;
      transition: background var(--transition-fast);
    }
    .start-btn:hover {
      background: var(--color-accent-hover);
    }
    .start-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    /* ── Active Session ── */
    .active-goal {
      padding: var(--sp-3) var(--sp-4);
      background: var(--color-card);
      border-bottom: 1px solid var(--color-line);
    }
    .goal-lbl {
      font-size: 10px;
      font-weight: var(--weight-semibold);
      color: var(--color-muted);
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-bottom: 2px;
    }
    .goal-txt {
      font-size: var(--text-sm);
      font-weight: var(--weight-semibold);
      color: var(--color-ink);
    }
    .timer-block {
      padding: var(--sp-4);
      text-align: center;
      background: var(--color-card);
    }
    .timer-lbl {
      font-size: 11px;
      color: var(--color-muted);
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-bottom: 4px;
    }
    .timer-big {
      font-size: 2.7rem;
      font-weight: var(--weight-bold);
      color: var(--color-accent);
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .timer-big.warden {
      color: var(--color-warden);
    }
    .active-sites {
      padding: var(--sp-2) var(--sp-4);
      font-size: 11px;
      color: var(--color-muted);
      background: var(--color-surface);
      border-top: 1px solid var(--color-line);
      border-bottom: 1px solid var(--color-line);
    }
    .actions {
      padding: var(--sp-3) var(--sp-4);
      display: flex;
      flex-direction: column;
      gap: var(--sp-2);
      background: var(--color-card);
    }
    .end-btn {
      padding: 8px var(--sp-4);
      background: var(--color-surface);
      border: 1px solid var(--color-line);
      border-radius: var(--radius-md);
      color: var(--color-muted);
      font-size: var(--text-xs);
      font-family: var(--font-sans);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .end-btn:hover {
      border-color: var(--color-warn-text);
      color: var(--color-warn-text);
    }
    .ext-btn {
      padding: 8px var(--sp-4);
      background: var(--color-surface);
      border: 1px solid var(--color-accent);
      border-radius: var(--radius-md);
      color: var(--color-accent);
      font-size: var(--text-xs);
      font-family: var(--font-sans);
      font-weight: var(--weight-semibold);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .ext-btn:hover {
      background: var(--color-accent);
      color: #fff;
    }
    .locked-note {
      font-size: 11px;
      color: var(--color-warden);
      text-align: center;
      padding: 4px 0;
      font-weight: var(--weight-medium);
    }
    .end-cd {
      font-size: var(--text-xs);
      color: var(--color-warn-text);
      font-weight: var(--weight-semibold);
      text-align: center;
    }
    .cancel-btn {
      padding: 6px;
      background: var(--color-surface);
      border: 1px solid var(--color-line);
      border-radius: var(--radius-md);
      color: var(--color-muted);
      font-size: var(--text-xs);
      cursor: pointer;
    }

    /* ── Sites Manager Tab ── */
    .site-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid var(--color-line);
      font-size: var(--text-xs);
    }
    .site-item:last-child {
      border-bottom: none;
    }
    .site-left {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .site-item input {
      accent-color: var(--color-accent);
    }
    .del-btn {
      background: none;
      border: none;
      color: var(--color-muted);
      cursor: pointer;
      font-size: 14px;
      padding: 0 4px;
    }
    .del-btn:hover {
      color: #C5221F;
    }
    .add-site-row {
      display: flex;
      gap: 6px;
      margin-top: var(--sp-2);
    }
    .add-btn {
      padding: 6px 12px;
      background: var(--color-accent);
      color: #fff;
      border: none;
      border-radius: var(--radius-md);
      font-size: var(--text-xs);
      font-weight: var(--weight-semibold);
      cursor: pointer;
    }
    .add-btn:hover {
      background: var(--color-accent-hover);
    }
    .presets-row {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      margin-bottom: var(--sp-2);
    }
    .preset-chip {
      font-size: 10px;
      padding: 3px 7px;
      background: var(--color-surface);
      border: 1px solid var(--color-line);
      border-radius: var(--radius-sm);
      color: var(--color-muted);
      cursor: pointer;
    }
    .preset-chip:hover {
      border-color: var(--color-accent);
      color: var(--color-accent);
    }

    /* ── Shield Tab ── */
    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid var(--color-line);
      font-size: var(--text-xs);
    }
    .switch-row:last-child {
      border-bottom: none;
    }
    .switch-label {
      font-weight: var(--weight-medium);
      color: var(--color-ink);
    }
    .switch-sub {
      font-size: 10px;
      color: var(--color-muted);
      display: block;
    }
    .switch-row input[type="checkbox"] {
      accent-color: var(--color-accent);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    /* ── Ambient Sound Tab ── */
    .sound-box {
      padding: var(--sp-4);
      text-align: center;
      background: var(--color-card);
    }
    .sound-icon {
      font-size: 2.2rem;
      margin-bottom: 4px;
    }
    .sound-title {
      font-size: var(--text-sm);
      font-weight: var(--weight-bold);
      color: var(--color-ink);
      margin-bottom: 2px;
    }
    .sound-desc {
      font-size: 11px;
      color: var(--color-muted);
      margin-bottom: var(--sp-4);
    }
    .sound-btn {
      width: 100%;
      padding: 10px;
      background: var(--color-accent);
      color: #fff;
      border: none;
      border-radius: var(--radius-md);
      font-size: var(--text-xs);
      font-weight: var(--weight-semibold);
      cursor: pointer;
      transition: background var(--transition-fast);
    }
    .sound-btn.playing {
      background: #C5221F;
    }
    .vol-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: var(--sp-3);
      font-size: 11px;
      color: var(--color-muted);
    }
    .vol-row input {
      flex: 1;
      accent-color: var(--color-accent);
    }
    .chime-test-btn {
      margin-top: var(--sp-3);
      padding: 6px var(--sp-3);
      background: var(--color-surface);
      border: 1px solid var(--color-line);
      border-radius: var(--radius-md);
      font-size: 11px;
      color: var(--color-muted);
      cursor: pointer;
    }
    .chime-test-btn:hover {
      border-color: var(--color-accent);
      color: var(--color-accent);
    }

    /* ── Stats Tab ── */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: var(--sp-3) var(--sp-4);
      background: var(--color-card);
    }
    .stat-card {
      background: var(--color-surface);
      border: 1px solid var(--color-line);
      border-radius: var(--radius-md);
      padding: 10px;
      text-align: center;
    }
    .stat-num {
      font-size: 1.5rem;
      font-weight: var(--weight-bold);
      color: var(--color-accent);
      line-height: 1.1;
    }
    .stat-lbl {
      font-size: 10px;
      color: var(--color-muted);
      text-transform: uppercase;
      letter-spacing: .04em;
      margin-top: 2px;
    }
    .streak-banner {
      background: #FEF7E0;
      border: 1px solid #FEEFC3;
      color: #B06000;
      padding: 8px 12px;
      margin: var(--sp-3) var(--sp-4) 0;
      border-radius: var(--radius-md);
      font-size: 12px;
      font-weight: var(--weight-bold);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ── Demo Footer ── */
    .demo-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px var(--sp-4);
      background: var(--color-surface);
      border-top: 1px solid var(--color-line);
      margin-top: auto;
    }
    .demo-rst {
      background: none;
      border: 1px solid var(--color-line);
      border-radius: var(--radius-sm);
      color: var(--color-muted);
      font-size: 11px;
      font-family: var(--font-sans);
      padding: 2px 8px;
      cursor: pointer;
    }
    .demo-rst:hover {
      border-color: var(--color-muted);
      color: var(--color-ink);
    }

    /* ── Error Banner ── */
    .err-msg {
      display: none;
      margin: 8px var(--sp-4) 0;
      padding: 6px 10px;
      background: var(--color-warn-bg);
      color: var(--color-warn-text);
      border-radius: var(--radius-sm);
      font-size: 11px;
      border: 1px solid var(--color-warn-text);
    }

    /* ── Warden Confirm Overlay ── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.6);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--sp-4);
      z-index: 99;
    }
    .confirm-card {
      background: var(--color-card);
      border-radius: var(--radius-lg);
      padding: var(--sp-5);
      width: 100%;
    }
    .confirm-card h2 {
      font-size: var(--text-base);
      font-weight: var(--weight-bold);
      color: var(--color-warden);
      margin-bottom: var(--sp-2);
    }
    .confirm-card p, .confirm-card li {
      font-size: var(--text-xs);
      color: var(--color-ink);
      line-height: var(--leading-base);
    }
    .confirm-card ul {
      padding-left: var(--sp-4);
      margin: var(--sp-2) 0;
    }
    .confirm-btns {
      display: flex;
      gap: var(--sp-2);
      margin-top: var(--sp-4);
    }
    .cancel-sm {
      flex: 1;
      padding: 8px;
      background: var(--color-surface);
      border: 1px solid var(--color-line);
      border-radius: var(--radius-md);
      color: var(--color-muted);
      font-size: var(--text-xs);
      cursor: pointer;
    }
    .confirm-sm {
      flex: 2;
      padding: 8px;
      background: var(--color-warden);
      border: none;
      border-radius: var(--radius-md);
      color: #fff;
      font-size: var(--text-xs);
      font-weight: var(--weight-semibold);
      cursor: pointer;
    }

    /* ── Premium Paywall Modal ── */
    .premium-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 8, 20, 0.82);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 10px 10px 0;
      z-index: 100;
      overflow-y: auto;
    }
    .premium-modal {
      background: linear-gradient(160deg, #1a1030 0%, #110d26 60%, #0d1a2e 100%);
      border: 1px solid rgba(155, 89, 255, 0.3);
      border-radius: 18px;
      padding: 20px 16px 16px;
      width: 100%;
      max-width: 340px;
      box-shadow: 0 24px 60px rgba(80,30,200,0.35), 0 0 0 1px rgba(255,255,255,0.05);
      position: relative;
      animation: modalPop .25s cubic-bezier(.34,1.56,.64,1) both;
    }
    @keyframes modalPop {
      from { opacity: 0; transform: translateY(16px) scale(.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .pm-close {
      position: absolute;
      top: 12px;
      right: 14px;
      background: rgba(255,255,255,0.08);
      border: none;
      color: rgba(255,255,255,0.5);
      border-radius: 50%;
      width: 26px;
      height: 26px;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .15s;
    }
    .pm-close:hover { background: rgba(255,255,255,0.15); color: #fff; }
    .pm-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: linear-gradient(90deg, #7c3aed, #a855f7);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      padding: 3px 9px;
      border-radius: 20px;
      margin-bottom: 10px;
    }
    .pm-title {
      font-size: 18px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 4px;
      line-height: 1.2;
    }
    .pm-sub {
      font-size: 11px;
      color: rgba(200,185,255,0.75);
      margin-bottom: 14px;
      line-height: 1.5;
    }
    .pm-features {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 14px;
    }
    .pm-feat {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: rgba(220,210,255,0.9);
    }
    .pm-feat-icon {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      flex-shrink: 0;
    }
    .pm-divider {
      border: none;
      border-top: 1px solid rgba(155,89,255,0.2);
      margin: 12px 0;
    }
    .pm-plans-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: rgba(180,160,255,0.7);
      margin-bottom: 8px;
    }
    .pm-plans {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-bottom: 14px;
    }
    .pm-plan {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1.5px solid rgba(155,89,255,0.25);
      background: rgba(255,255,255,0.04);
      cursor: pointer;
      transition: border-color .15s, background .15s, transform .1s;
      position: relative;
      overflow: hidden;
    }
    .pm-plan:hover {
      border-color: rgba(168,85,247,0.7);
      background: rgba(168,85,247,0.1);
      transform: translateY(-1px);
    }
    .pm-plan.selected {
      border-color: #a855f7;
      background: rgba(168,85,247,0.18);
      box-shadow: 0 0 0 1px rgba(168,85,247,0.4);
    }
    .pm-plan-popular {
      position: absolute;
      top: 0;
      right: 10px;
      background: linear-gradient(90deg, #f59e0b, #f97316);
      color: #fff;
      font-size: 8px;
      font-weight: 800;
      letter-spacing: .06em;
      text-transform: uppercase;
      padding: 2px 6px;
