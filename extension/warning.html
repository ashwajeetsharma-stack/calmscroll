<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CalmScroll — Focus Shield</title>
  <link rel="stylesheet" href="shared/theme.css">
  <style>
    *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: var(--font-sans); overflow: hidden; }

    /* ════════════════════════════════════════
       TWO-PANEL LAYOUT
       Left  → quote photo + big text
       Right → glass control card
    ════════════════════════════════════════ */
    body {
      display: flex;
      flex-direction: row;
      height: 100vh;
    }

    /* ── LEFT: scenic quote panel ── */
    #quotePanel {
      flex: 1;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;  /* quote sits at bottom of the image */
      padding: 40px 44px;
      background: #0a1020;        /* fallback while image loads */
    }

    /* the actual background image layer */
    #quoteBg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transition: opacity 0.8s ease;
      z-index: 0;
    }

    /* gradient so quote text is always legible */
    #quoteBg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.20) 0%,
        rgba(0,0,0,0.05) 35%,
        rgba(0,0,0,0.55) 72%,
        rgba(0,0,0,0.80) 100%
      );
    }

    /* quote text content — sits ABOVE the gradient layer */
    #quoteContent {
      position: relative;
      z-index: 1;
      color: #fff;
      max-width: 520px;
      transition: opacity 0.5s ease;
    }

    #quoteLabel {
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.55);
      margin-bottom: 14px;
      font-weight: 500;
    }

    #quoteText {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(1.4rem, 2.5vw, 2rem);
      font-style: italic;
      line-height: 1.5;
      color: #fff;
      text-shadow: 0 2px 14px rgba(0,0,0,0.7);
      margin-bottom: 16px;
    }

    #quoteAttrib {
      font-size: 0.82rem;
      color: rgba(255,255,255,0.60);
      letter-spacing: 0.04em;
    }

    /* dot navigation */
    #quoteDots {
      display: flex;
      gap: 7px;
      margin-top: 22px;
    }
    .qdot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: rgba(255,255,255,0.35);
      cursor: pointer;
      border: none;
      padding: 0;
      transition: background 0.2s, transform 0.2s;
    }
    .qdot.active { background: #fff; transform: scale(1.45); }

    /* ── RIGHT: control card ── */
    #cardPanel {
      width: 440px;
      min-width: 380px;
      height: 100vh;
      overflow-y: auto;
      background: rgba(255,255,255,0.14);
      backdrop-filter: blur(22px) saturate(1.5);
      -webkit-backdrop-filter: blur(22px) saturate(1.5);
      border-left: 1px solid rgba(255,255,255,0.18);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 32px 28px;
    }

    .card {
      width: 100%;
      color: #fff;
      animation: fadeUp 0.35s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* card internals */
    .top-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
    .brand { font-size: var(--text-sm); color: rgba(255,255,255,0.95); font-weight: var(--weight-bold); display: flex; align-items: center; gap: var(--sp-2); }
    .deflect-badge { font-size: 11px; padding: 3px 8px; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.22); border-radius: var(--radius-sm); color: rgba(255,255,255,0.75); font-weight: var(--weight-medium); }

    .hero { display: flex; align-items: center; gap: var(--sp-3); margin-bottom: 16px; }
    .emoji { font-size: 2rem; line-height: 1; }
    h1 { font-size: var(--text-xl); font-weight: var(--weight-bold); line-height: var(--leading-tight); color: #fff; }

    .goal-box { background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.18); border-left: 4px solid rgba(255,255,255,0.55); border-radius: var(--radius-md); padding: 10px 14px; margin-bottom: 14px; font-size: var(--text-sm); display: none; }
    .goal-box strong { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: rgba(255,255,255,0.6); margin-bottom: 4px; }
    .goal-txt { color: #fff; font-weight: var(--weight-semibold); }

    h2 { font-size: 11px; font-weight: var(--weight-semibold); color: rgba(255,255,255,0.6); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px; }
    .options { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
    .opt { width: 100%; padding: 10px 14px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.18); border-radius: var(--radius-md); color: rgba(255,255,255,0.88); font-size: var(--text-sm); font-family: var(--font-sans); cursor: pointer; text-align: left; transition: all 0.15s ease; }
    .opt:hover { background: rgba(255,255,255,0.18); border-color: rgba(255,255,255,0.45); }
    .opt.sel { background: rgba(255,255,255,0.25); border-color: rgba(255,255,255,0.65); color: #fff; }

    .coaching { background: rgba(255,255,255,0.10); border-left: 3px solid rgba(255,255,255,0.5); border-radius: 0 var(--radius-md) var(--radius-md) 0; padding: 10px 14px; font-size: var(--text-sm); line-height: var(--leading-loose); display: none; margin-bottom: 14px; color: rgba(255,255,255,0.90); animation: fadeUp 0.2s ease; }

    .pass-box { padding: 10px 14px; border-radius: var(--radius-md); background: rgba(255,200,80,0.13); border: 1px solid rgba(255,200,80,0.38); margin-bottom: 14px; font-size: var(--text-xs); line-height: var(--leading-base); display: none; color: rgba(255,230,150,0.95); }
    .pass-btn { margin-top: 8px; width: 100%; padding: 8px 12px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,200,80,0.45); color: rgba(255,230,140,1); font-weight: var(--weight-semibold); border-radius: var(--radius-sm); cursor: pointer; font-family: var(--font-sans); transition: all 0.15s; }
    .pass-btn:hover { background: rgba(255,200,80,0.28); }
    .warden-lock-note { color: rgba(180,200,255,0.9); font-weight: var(--weight-semibold); display: flex; align-items: center; gap: 4px; }

    .btns { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn-back  { flex: 1; min-width: 120px; padding: 10px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.22); border-radius: var(--radius-md); color: rgba(255,255,255,0.88); font-size: var(--text-sm); font-family: var(--font-sans); font-weight: var(--weight-semibold); cursor: pointer; transition: all 0.15s; }
    .btn-back:hover  { background: rgba(255,255,255,0.18); border-color: rgba(255,255,255,0.45); }
    .btn-reset { flex: 1; min-width: 120px; padding: 10px; background: rgba(255,255,255,0.20); border: 1px solid rgba(255,255,255,0.38); border-radius: var(--radius-md); color: #fff; font-size: var(--text-sm); font-weight: var(--weight-semibold); font-family: var(--font-sans); cursor: pointer; transition: all 0.15s; }
    .btn-reset:hover { background: rgba(255,255,255,0.30); }

    /* ── Responsive: stack vertically on narrow screens ── */
    @media (max-width: 700px) {
      body { flex-direction: column; overflow-y: auto; height: auto; }
      #quotePanel { min-height: 260px; flex: none; padding: 28px 24px 28px; justify-content: flex-end; }
      #cardPanel { width: 100%; min-width: unset; height: auto; border-left: none; border-top: 1px solid rgba(255,255,255,0.18); padding: 24px 20px; }
    }
  </style>
</head>
<body>

  <!-- ══ LEFT: Quote photo panel ══ -->
  <div id="quotePanel">
    <div id="quoteBg"></div>

    <div id="quoteContent">
      <div id="quoteLabel">🌿 CalmScroll · Mindful Pause</div>
      <div id="quoteText"></div>
      <div id="quoteAttrib"></div>
      <div id="quoteDots"></div>
    </div>
  </div>

  <!-- ══ RIGHT: Control card ══ -->
  <div id="cardPanel">
    <div class="card">
      <div class="top-row">
        <div class="brand">🛑 Distraction Paused</div>
        <div class="deflect-badge" id="deflectBadge">🛡️ Deflection #1</div>
      </div>

      <div class="goal-box" id="goalBox">
        <strong>Your Active Focus Goal</strong>
        <span class="goal-txt" id="goalTxt"></span>
      </div>

      <h2>What brings you here?</h2>
      <div class="options" id="opts">
        <button class="opt" id="opt-stuck">🧩 Stuck on a problem, seeking escape</button>
        <button class="opt" id="opt-bored">😶 Honestly just bored or restless</button>
        <button class="opt" id="opt-check">📲 Habitual impulse — nothing specific</button>
        <button class="opt" id="opt-skip">🚪 Skip — close tab and return</button>
      </div>

      <div class="coaching" id="coaching"></div>

      <div class="pass-box" id="passBox">
        <div id="passText">Need this page strictly for your study/work task?</div>
        <button class="pass-btn" id="btnPass">⏱️ Take 5-Minute Study Pass</button>
        <div id="wardenNote" class="warden-lock-note" style="display:none;">🔒 Warden Mode — Study passes disabled.</div>
      </div>

      <div class="btns">
        <button class="btn-back"  id="btnBack">← Return to work</button>
        <button class="btn-reset" id="btnReset">2-Min Reset →</button>
      </div>
    </div>
  </div>

  <script src="warning.js"></script>
</body>
</html>
